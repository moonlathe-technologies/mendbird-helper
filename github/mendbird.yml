# Mendbird helper for __MENDBIRD_HOST__. Save this file as .github/workflows/mendbird.yml in the repository the site is
# built from, then add a repository secret called MENDBIRD_KEY (Settings, Secrets and variables, Actions) with the key
# shown in your Mendbird account.
#
# It reads the names and versions in your lock files, prints them in this workflow's log, and sends them to Mendbird
# to check against the lists of known security flaws. It only reads, and never changes your repository. The whole
# program is below, so you can see exactly what it does. Delete this file and it stops.

name: Mendbird helper
on:
  push:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  send:
    # Pushes to other branches are left alone: the live site is built from the main one.
    if: github.event_name != 'push' || github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Send the names and versions of your packages to Mendbird
        env:
          MENDBIRD_KEY: ${{ secrets.MENDBIRD_KEY }}
          MENDBIRD_SITE: "__MENDBIRD_SITE__"
        run: |
          node --input-type=module <<'MENDBIRD'
__SCRIPT__
          MENDBIRD
